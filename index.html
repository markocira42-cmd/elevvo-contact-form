<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Mark Ocira">
    <meta name="title" content="Elevvo Contact Form">
    <meta name="description" content="contact form, elevvo pathways internship">
    <title>Elevvo Contact Form</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main>
        <section>
            <h3>Contact Form</h3>
            <form id="contact-form">
                <label for="name">Full Name:</label>
                <input type="text" name="name" id="name" required placeholder="Full name">

                <label for="email">Email:</label>
                <input type="email" name="email" id="email" required placeholder="Email">

                <label for="subject">Subject:</label>
                <input type="text" name="subject" id="subject" required placeholder="Subject">

                <label for="message">Message:</label>
                <textarea name="message" id="message" required placeholder="Message"></textarea>

                <input type="submit" name="submit" id="submit" value="Submit">
            </form>
        </section>
    </main>
</body>
</html>
