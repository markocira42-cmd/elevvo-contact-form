<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Mark Ocira">
    <meta name="title" content="Elevvo Contact Form">
    <meta name="description" content="contact form, elevvo pathways internship">
    <title>Elevvo Contact Form</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="assets/icons/font-awesome-library/webfonts-css/all.css">
</head>
<body>
    <main>
        <section>
            <form id="contact-form">
                <h2 class="heading">Contact Form</h2>

                <div class="error-div">
                    <strong id="error"></strong>
                    <button class="x-btn" type="button">
                        <i class="fas fa-xmark"></i>
                    </button>
                </div>
                
                <div class="success-div">
                    <strong id="success"></strong>
                    <button class="x-btn" type="button">
                        <i class="fas fa-xmark"></i>
                    </button>
                </div>

                <label for="name">Full Name:</label>
                <input type="text" name="name" id="name" required placeholder="Enter your full name">

                <label for="email">Email:</label>
                <input type="email" name="email" id="email" required placeholder="Enter your email">

                <label for="subject">Subject:</label>
                <input type="text" name="subject" id="subject" required placeholder="Subject">

                <label for="message">Message:</label>
                <textarea name="message" id="message" required placeholder="Message..."></textarea>

                <input type="submit" name="submit" id="submit" value="Send Message" class="btn-1">
            </form>
        </section>
    </main>
</body>
</html>
